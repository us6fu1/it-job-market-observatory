<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
  <title id="title">IT Job Market Observatory dashboard preview</title>
  <desc id="desc">Превью дашборда с 36 вакансиями, 22 работодателями, 13 регионами и покрытием зарплатами 92 процента.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.58" stop-color="#172554"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="10%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".48"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <style>
      .ui { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #64748b; }
      .label { fill: #475569; font-size: 17px; }
      .metric { fill: #0f172a; font-size: 42px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1400" height="880" rx="28" fill="#f8fafc"/>
  <rect x="28" y="28" width="1344" height="824" rx="24" fill="#ffffff" stroke="#e2e8f0"/>

  <g filter="url(#shadow)">
    <rect x="64" y="58" width="1272" height="265" rx="28" fill="url(#hero)"/>
    <rect x="64" y="58" width="1272" height="265" rx="28" fill="url(#glow)"/>
  </g>
  <g class="ui" fill="#fff">
    <text x="105" y="101" font-size="14" font-weight="700" letter-spacing="3" opacity=".72">DATA ENGINEERING PORTFOLIO PROJECT</text>
    <text x="105" y="165" font-size="48" font-weight="760" letter-spacing="-1.5">IT Job Market Observatory</text>
    <text x="105" y="211" font-size="19" opacity=".84">ETL-система для анализа вакансий Data Analyst, BI Developer и Data Engineer.</text>
    <text x="105" y="242" font-size="19" opacity=".84">REST API → RAW → STG → DWH → MART → интерактивный дашборд</text>
    <g font-size="14" opacity=".9">
      <rect x="105" y="269" width="74" height="32" rx="16" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".18"/><text x="126" y="290">Python</text>
      <rect x="191" y="269" width="104" height="32" rx="16" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".18"/><text x="210" y="290">PostgreSQL</text>
      <rect x="307" y="269" width="54" height="32" rx="16" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".18"/><text x="321" y="290">SQL</text>
      <rect x="373" y="269" width="86" height="32" rx="16" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".18"/><text x="391" y="290">REST API</text>
      <rect x="471" y="269" width="90" height="32" rx="16" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".18"/><text x="488" y="290">Streamlit</text>
      <rect x="573" y="269" width="75" height="32" rx="16" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".18"/><text x="590" y="290">Docker</text>
    </g>
  </g>

  <rect x="64" y="350" width="1272" height="58" rx="14" fill="#f0f9ff" stroke="#bae6fd"/>
  <circle cx="94" cy="379" r="7" fill="#16a34a"/>
  <text class="ui" x="113" y="386" font-size="17" fill="#0c4a6e">Живая загрузка из открытого API «Работа России» · статус: success · 23 API-запроса · 0 ошибок</text>

  <g class="ui" filter="url(#shadow)">
    <g transform="translate(64 438)">
      <rect width="286" height="126" rx="18" fill="#fff" stroke="#e2e8f0"/>
      <text class="label" x="25" y="39">Вакансии</text><text class="metric" x="25" y="93">36</text>
    </g>
    <g transform="translate(383 438)">
      <rect width="286" height="126" rx="18" fill="#fff" stroke="#e2e8f0"/>
      <text class="label" x="25" y="39">Работодатели</text><text class="metric" x="25" y="93">22</text>
    </g>
    <g transform="translate(702 438)">
      <rect width="286" height="126" rx="18" fill="#fff" stroke="#e2e8f0"/>
      <text class="label" x="25" y="39">Регионы</text><text class="metric" x="25" y="93">13</text>
    </g>
    <g transform="translate(1021 438)">
      <rect width="315" height="126" rx="18" fill="#fff" stroke="#e2e8f0"/>
      <text class="label" x="25" y="39">С указанной зарплатой</text><text class="metric" x="25" y="93">92%</text>
    </g>
  </g>

  <g class="ui">
    <text x="64" y="619" font-size="18" font-weight="650" fill="#ef4444">Обзор</text>
    <text x="142" y="619" font-size="18" fill="#475569">Навыки</text>
    <text x="222" y="619" font-size="18" fill="#475569">Вакансии</text>
    <text x="326" y="619" font-size="18" fill="#475569">Качество данных</text>
    <rect x="64" y="633" width="54" height="3" rx="2" fill="#ef4444"/>
    <line x1="64" y1="636" x2="1336" y2="636" stroke="#e2e8f0"/>

    <text x="64" y="687" font-size="27" font-weight="700" fill="#0f172a">Вакансии по направлениям</text>
    <text x="64" y="716" font-size="15" class="muted">Одна вакансия может попасть сразу в несколько групп</text>

    <text x="64" y="762" font-size="16" fill="#475569">Data Analyst</text>
    <rect x="210" y="744" width="690" height="24" rx="7" fill="#e0f2fe"/><rect x="210" y="744" width="620" height="24" rx="7" fill="#2563eb"/>
    <text x="847" y="762" font-size="16" font-weight="700" fill="#1e3a8a">27</text>

    <text x="64" y="805" font-size="16" fill="#475569">BI Developer</text>
    <rect x="210" y="787" width="690" height="24" rx="7" fill="#e0f2fe"/><rect x="210" y="787" width="115" height="24" rx="7" fill="#0ea5e9"/>
    <text x="342" y="805" font-size="16" font-weight="700" fill="#075985">5</text>

    <text x="970" y="687" font-size="27" font-weight="700" fill="#0f172a">Качество</text>
    <rect x="970" y="724" width="366" height="88" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="1005" cy="755" r="8" fill="#16a34a"/><text x="1025" y="761" font-size="16" fill="#334155">34 модульных теста</text>
    <circle cx="1005" cy="787" r="8" fill="#16a34a"/><text x="1025" y="793" font-size="16" fill="#334155">6 SQL-проверок без ошибок</text>
  </g>
</svg>
